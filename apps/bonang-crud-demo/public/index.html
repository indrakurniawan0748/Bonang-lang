<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonang CRUD Demo</title>
    <!-- Favicon inline kosong supaya browser tidak requesting /favicon.ico
         yang tidak ada (permintaan otomatis browser selalu terjadi saat
         favicon tidak dideklarasikan). -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <h1>Bonang CRUD Demo</h1>
        <div class="toolbar">
            <span id="status" class="status">Memuat...</span>
            <button id="reload-button" class="secondary" type="button">Muat ulang</button>
            <button id="sync-button" class="secondary" type="button">Sinkronkan</button>
        </div>
    </header>

    <p id="message" class="message info"></p>

    <main class="layout">
        <section class="panel">
            <h2 id="form-title">Tambah produk</h2>
            <form id="product-form">
                <input type="hidden" id="product-id">
                <label for="product-name">Nama</label>
                <input type="text" id="product-name" required maxlength="120" autocomplete="off">

                <label for="product-description">Deskripsi</label>
                <textarea id="product-description" rows="3" maxlength="1000"></textarea>

                <label for="product-price">Harga</label>
                <input type="number" id="product-price" required min="0" step="0.01" value="0">

                <label for="product-stock">Stok</label>
                <input type="number" id="product-stock" required min="0" step="1" value="0">

                <div class="form-actions">
                    <button type="submit" class="primary">Simpan</button>
                    <button type="button" id="reset-button" class="secondary">Bersihkan</button>
                </div>
            </form>
        </section>

        <section class="panel">
            <h2>Daftar produk</h2>
            <div id="product-list" class="product-list"></div>
        </section>
    </main>

    <script src="client.js"></script>
</body>
</html>
